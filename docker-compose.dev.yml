services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: story_tide
      POSTGRES_PASSWORD: story_tide
      POSTGRES_DB: story_tide
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story_tide -d story_tide"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    # Fork maintenu de MinIO (upstream archivé 04/2026) — voir docs/adr/0028-migration-minio-vers-silo.md
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: story_tide
      MINIO_ROOT_PASSWORD: change-me-story-tide
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-setup:
    # Fork maintenu de MinIO (upstream archivé 04/2026) — voir docs/adr/0028-migration-minio-vers-silo.md
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      minio:
        condition: service_healthy
    # story-tide-e2e (KAN-16) : meme instance MinIO que le bucket dev, meme
    # credentials root - le smoke Playwright (e2e/) ne cree pas sa propre
    # instance MinIO isolee (contrairement a la base Postgres e2e, qui a sa
    # propre base sur le meme conteneur). Prive par defaut, comme le bucket dev.
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 story_tide change-me-story-tide &&
      mcli mb --ignore-existing local/story-tide-dev &&
      mcli anonymous set none local/story-tide-dev &&
      mcli mb --ignore-existing local/story-tide-e2e &&
      mcli anonymous set none local/story-tide-e2e
      "

volumes:
  pg_data:
  minio_data:
